<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Cove Bible — Creator's Cove</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Nunito", system-ui, sans-serif; color: #17384a; background: linear-gradient(180deg, #8fe0f2 0%, #2a9db8 46%, #0d5a74 100%); min-height: 100vh; padding: 0 14px 44px; }
  .cove-back-btn { display: inline-block; min-height: 48px; line-height: 48px; padding: 0 18px; margin: 12px 0 0; border-radius: 999px; background: #fff; color: #12303e; font-weight: 800; text-decoration: none; box-shadow: 0 2px 8px rgba(0,0,0,.25); }
  main { max-width: 560px; margin: 0 auto; }
  h1 { font-family: "Fredoka", sans-serif; color: #ffc93c; text-align: center; margin: 14px 0 2px; font-size: clamp(1.9rem, 8vw, 2.6rem); text-shadow: 0 3px 0 rgba(0,0,0,.25); }
  .sub { text-align: center; color: #ffe9a8; font-weight: 800; letter-spacing: .18em; text-transform: uppercase; font-size: .8rem; margin: 0 0 16px; }
  .card { background: rgba(255,248,234,.97); border-radius: 22px; padding: 18px; box-shadow: 0 14px 32px rgba(4,40,56,.3); margin-bottom: 14px; }
  .card h2 { font-family: "Fredoka", sans-serif; margin: 0 0 4px; font-size: 1.35rem; color: #0d5a74; }
  .card .ref { font-weight: 800; color: #7a5b00; margin: 0 0 10px; font-size: .9rem; }
  .verses { font-size: 1.05rem; line-height: 1.7; font-weight: 600; }
  .verses p { margin: 0 0 8px; }
  .verses sup { color: #b97e06; font-weight: 800; }
  .btn { min-height: 50px; padding: 8px 20px; border-radius: 999px; border: 2px solid #e89b0c; background: linear-gradient(180deg, #ffe08a, #ffc93c); color: #4a2c00; font-family: "Fredoka", sans-serif; font-weight: 600; font-size: 1rem; cursor: pointer; box-shadow: 0 3px 0 #e89b0c; margin-top: 10px; }
  .btn:active { transform: translateY(2px); box-shadow: 0 1px 0 #e89b0c; }
  .daily { border: 3px solid #f2b33d; }
  .note { text-align: center; color: #ffe9a8; font-weight: 700; font-size: .9rem; }
</style>
</head>
<body>
<a class="cove-back-btn" href="../index.html">← Back to Cove</a>
<main>
  <h1>📖 Cove Bible</h1>
  <p class="sub">King James Version · Read or Listen</p>
  <div id="passages"></div>
  <p class="note">Scripture text: King James Version (public domain). More passages will be added over time.</p>
</main>
<audio id="player" preload="metadata"></audio>
<script>
  var PASSAGES = [
    { title: "The Lord Is My Shepherd", ref: "Psalm 23", audio: "bible/psalm23.mp3", verses: [
      "The Lord is my shepherd; I shall not want.",
      "He maketh me to lie down in green pastures: he leadeth me beside the still waters.",
      "He restoreth my soul: he leadeth me in the paths of righteousness for his name's sake.",
      "Yea, though I walk through the valley of the shadow of death, I will fear no evil: for thou art with me; thy rod and thy staff they comfort me.",
      "Thou preparest a table before me in the presence of mine enemies: thou anointest my head with oil; my cup runneth over.",
      "Surely goodness and mercy shall follow me all the days of my life: and I will dwell in the house of the Lord for ever."
    ]},
    { title: "Under His Wings", ref: "Psalm 91", audio: "bible/psalm91.mp3", verses: [
      "He that dwelleth in the secret place of the most High shall abide under the shadow of the Almighty.",
      "I will say of the Lord, He is my refuge and my fortress: my God; in him will I trust.",
      "Surely he shall deliver thee from the snare of the fowler, and from the noisome pestilence.",
      "He shall cover thee with his feathers, and under his wings shalt thou trust: his truth shall be thy shield and buckler.",
      "Thou shalt not be afraid for the terror by night; nor for the arrow that flieth by day;",
      "Nor for the pestilence that walketh in darkness; nor for the destruction that wasteth at noonday.",
      "A thousand shall fall at thy side, and ten thousand at thy right hand; but it shall not come nigh thee.",
      "Only with thine eyes shalt thou behold and see the reward of the wicked.",
      "Because thou hast made the Lord, which is my refuge, even the most High, thy habitation;",
      "There shall no evil befall thee, neither shall any plague come nigh thy dwelling.",
      "For he shall give his angels charge over thee, to keep thee in all thy ways.",
      "They shall bear thee up in their hands, lest thou dash thy foot against a stone.",
      "Thou shalt tread upon the lion and adder: the young lion and the dragon shalt thou trample under feet.",
      "Because he hath set his love upon me, therefore will I deliver him: I will set him on high, because he hath known my name.",
      "He shall call upon me, and I will answer him: I will be with him in trouble; I will deliver him, and honour him.",
      "With long life will I satisfy him, and shew him my salvation."
    ]},
    { title: "My Help Cometh", ref: "Psalm 121", audio: "bible/psalm121.mp3", verses: [
      "I will lift up mine eyes unto the hills, from whence cometh my help.",
      "My help cometh from the Lord, which made heaven and earth.",
      "He will not suffer thy foot to be moved: he that keepeth thee will not slumber.",
      "Behold, he that keepeth Israel shall neither slumber nor sleep.",
      "The Lord is thy keeper: the Lord is thy shade upon thy right hand.",
      "The sun shall not smite thee by day, nor the moon by night.",
      "The Lord shall preserve thee from all evil: he shall preserve thy soul.",
      "The Lord shall preserve thy going out and thy coming in from this time forth, and even for evermore."
    ]},
    { title: "The Greatest of These", ref: "1 Corinthians 13", audio: "bible/corinthians13.mp3", verses: [
      "Though I speak with the tongues of men and of angels, and have not charity, I am become as sounding brass, or a tinkling cymbal.",
      "And though I have the gift of prophecy, and understand all mysteries, and all knowledge; and though I have all faith, so that I could remove mountains, and have not charity, I am nothing.",
      "And though I bestow all my goods to feed the poor, and though I give my body to be burned, and have not charity, it profiteth me nothing.",
      "Charity suffereth long, and is kind; charity envieth not; charity vaunteth not itself, is not puffed up,",
      "Doth not behave itself unseemly, seeketh not her own, is not easily provoked, thinketh no evil;",
      "Rejoiceth not in iniquity, but rejoiceth in the truth;",
      "Beareth all things, believeth all things, hopeth all things, endureth all things.",
      "Charity never faileth: but whether there be prophecies, they shall fail; whether there be tongues, they shall cease; whether there be knowledge, it shall vanish away.",
      "For we know in part, and we prophesy in part.",
      "But when that which is perfect is come, then that which is in part shall be done away.",
      "When I was a child, I spake as a child, I understood as a child, I thought as a child: but when I became a man, I put away childish things.",
      "For now we see through a glass, darkly; but then face to face: now I know in part; but then shall I know even as also I am known.",
      "And now abideth faith, hope, charity, these three; but the greatest of these is charity."
    ]},
    { title: "In the Beginning", ref: "John 1:1–14", audio: "bible/john1.mp3", verses: [
      "In the beginning was the Word, and the Word was with God, and the Word was God.",
      "The same was in the beginning with God.",
      "All things were made by him; and without him was not any thing made that was made.",
      "In him was life; and the life was the light of men.",
      "And the light shineth in darkness; and the darkness comprehended it not.",
      "There was a man sent from God, whose name was John.",
      "The same came for a witness, to bear witness of the Light, that all men through him might believe.",
      "He was not that Light, but was sent to bear witness of that Light.",
      "That was the true Light, which lighteth every man that cometh into the world.",
      "He was in the world, and the world was made by him, and the world knew him not.",
      "He came unto his own, and his own received him not.",
      "But as many as received him, to them gave he power to become the sons of God, even to them that believe on his name:",
      "Which were born, not of blood, nor of the will of the flesh, nor of the will of man, but of God.",
      "And the Word was made flesh, and dwelt among us, (and we beheld his glory, the glory as of the only begotten of the Father,) full of grace and truth."
    ]}
  ];
  var player = document.getElementById("player");
  var currentBtn = null;
  function stopBtn() { if (currentBtn) { currentBtn.textContent = "🔊 Listen"; currentBtn = null; } }
  player.addEventListener("pause", stopBtn);
  player.addEventListener("ended", stopBtn);
  var wrap = document.getElementById("passages");
  var dayIdx = Math.floor(Date.now() / 86400000) % PASSAGES.length;
  PASSAGES.forEach(function (p, i) {
    var card = document.createElement("section");
    card.className = "card" + (i === dayIdx ? " daily" : "");
    var html = "<h2>" + p.title + "</h2><p class=\"ref\">" + p.ref + (i === dayIdx ? " · Today's passage" : "") + "</p><div class=\"verses\">";
    p.verses.forEach(function (v, vi) { html += "<p><sup>" + (vi + 1) + "</sup> " + v + "</p>"; });
    html += "</div>";
    card.innerHTML = html;
    var b = document.createElement("button");
    b.type = "button"; b.className = "btn"; b.textContent = "🔊 Listen";
    b.addEventListener("click", function () {
      if (currentBtn === b && !player.paused) { player.pause(); return; }
      stopBtn();
      player.src = p.audio;
      player.play().catch(function () {});
      currentBtn = b;
      b.textContent = "⏸ Pause";
    });
    card.appendChild(b);
    wrap.appendChild(card);
  });
  document.addEventListener("visibilitychange", function () { if (document.hidden) player.pause(); });
  window.addEventListener("pagehide", function () { player.pause(); });
</script>
<script>

</script>
</body>
</html>
